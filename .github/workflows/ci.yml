name: CI

on:
  push:
    # Only dev accepts direct pushes; main is strictly via PR from dev.
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-flow-guard:
    name: Branch Flow Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [[ "$BASE" == "main" && "$HEAD" != "dev" ]]; then
            echo "ERROR: Pull requests to main must originate from dev."
            echo "Allowed flow: feature/* -> dev -> main"
            exit 1
          fi
          if [[ "$BASE" == "dev" && ( "$HEAD" == "main" || "$HEAD" == "dev" ) ]]; then
            echo "ERROR: Pull requests to dev must originate from a feature branch."
            exit 1
          fi
          echo "Branch flow allowed."

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: branch-flow-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [branch-flow-guard, lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: [branch-flow-guard, lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [branch-flow-guard, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/utils/path.js
          echo "Build artifacts verified"

  no-committed-build-artifacts:
    name: No Committed Build Artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for committed dist/
        run: |
          if [ -d dist ]; then
            echo "ERROR: dist/ directory is committed to the repository."
            exit 1
          fi
          echo "No committed build artifacts"
